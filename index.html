<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artsee</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <a class="logo-wrapper" id="logo-wrapper" href="/index.html">
        <div
          class="logo"
          id="logo-lottie"
          style="width: 200px; height: 200px"
        ></div>
      </a>
      <div class="favorite-button">
        <img
          src="/assets/favorite_symbol.svg"
          class="favorite-symbol"
          alt="Favorites"
        />
        <p class="favorite-text">Favorites</p>
      </div>
    </header>

    <main>
      <!-- Search row -->
      <div class="search-row">
        <div class="search-container">
          <input
            class="search-input"
            type="text"
            placeholder="Search for artist or artwork"
            id="search"
            autocomplete="off"
          />
          <button class="search-btn" aria-label="Search">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8" />
              <path d="m21 21-4.35-4.35" />
            </svg>
          </button>
        </div>

        <!-- Filter toggle button -->
        <button
          class="filter-toggle-btn"
          id="filter-toggle"
          aria-expanded="false"
          aria-controls="filter-panel"
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="4" y1="6" x2="20" y2="6" />
            <line x1="8" y1="12" x2="16" y2="12" />
            <line x1="11" y1="18" x2="13" y2="18" />
          </svg>
          Filters
          <span class="filter-badge" hidden>0</span>
          <svg
            class="filter-chevron"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="transition: transform 0.25s ease"
          >
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
      </div>

      <!-- Filter panel -->
      <div
        class="filter-panel"
        id="filter-panel"
        role="region"
        aria-label="Search filters"
      >
        <div class="filter-grid">
          <!-- Department -->
          <div class="filter-field">
            <label class="filter-label" for="filter-department"
              >Department</label
            >
            <div class="select-wrapper">
              <select class="filter-select" id="filter-department">
                <!-- populated by JS -->
              </select>
              <svg
                class="select-arrow"
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 9 6 6 6-6" />
              </svg>
            </div>
          </div>

          <!-- Date range -->
          <div class="filter-field">
            <label class="filter-label">Year range</label>
            <div class="date-range">
              <input
                class="filter-input"
                type="number"
                id="filter-date-from"
                placeholder="From (e.g. 1800)"
                min="-3000"
                max="2025"
              />
              <span class="date-range-sep">–</span>
              <input
                class="filter-input"
                type="number"
                id="filter-date-to"
                placeholder="To (e.g. 1900)"
                min="-3000"
                max="2025"
              />
            </div>
          </div>

          <!-- Medium -->
          <div class="filter-field">
            <label class="filter-label" for="filter-medium"
              >Medium / Material</label
            >
            <input
              class="filter-input"
              type="text"
              id="filter-medium"
              placeholder="e.g. Oil on canvas"
              autocomplete="off"
            />
          </div>
        </div>

        <!-- Actions -->
        <div class="filter-actions">
          <button class="filter-reset-btn" id="filter-reset">Reset</button>
          <button class="filter-apply-btn" id="filter-apply">
            Apply filters
          </button>
        </div>
      </div>

      <!-- Active filter tags -->
      <div class="active-filters" id="active-filters"></div>

      <p class="result-count" id="count">Loading…</p>
    </main>

    <ul class="artwork-list" id="artwork-list"></ul>

    <nav class="pagination" aria-label="Pages"></nav>

    <footer class="footer">
      <div class="footer-line"></div>
      <div class="footer-content">
        <div class="footer-heart">♥</div>
        <p>Made with Love by Anselm and Jérôme</p>
        <div class="footer-links">
          <a href="/mission.html">Our Mission</a>
          <a href="/support.html">Support & FAQ</a>
        </div>
        <div class="footer-contact">
          <p>Contact</p>
          <p>Holzikofenweg 8</p>
          <p>3007 Bern</p>
          <p>Switzerland</p>
        </div>
      </div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="/js/script.js"></script>
  </body>
</html>
